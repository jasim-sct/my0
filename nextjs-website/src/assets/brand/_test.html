<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SVG Symbol Test</title>
<style>
  body { background: #f4f3f0; display: flex; gap: 40px; padding: 40px; font-family: system-ui; align-items: flex-start; flex-wrap: wrap; }
  .card { background: white; border-radius: 12px; padding: 32px; box-shadow: 0 4px 24px rgba(0,0,0,0.1); }
  .card.dark { background: #0c0c0d; }
  h3 { margin: 0 0 16px; font-size: 13px; color: #999; letter-spacing: 0.08em; text-transform: uppercase; }
  .dark h3 { color: #444; }
  img { display: block; max-width: 200px; }
  .ref { display: flex; gap: 20px; flex-wrap: wrap; }
</style>
</head>
<body>
  <div class="card">
    <h3>Reference — Brand PNG</h3>
    <img src="/assets/img/og-logo.png" width="200" height="200" alt="Reference">
  </div>
  <div class="card">
    <h3>Master SVG (light bg)</h3>
    <img src="/src-preview/axio-symbol.svg" width="200" height="200" alt="SVG symbol">
  </div>
  <div class="card dark">
    <h3>Master SVG (dark bg)</h3>
    <img src="/src-preview/axio-symbol-dark.svg" width="200" height="200" alt="SVG dark">
  </div>
  <div class="card">
    <h3>Favicon SVG (32px test)</h3>
    <img src="/src-preview/axio-favicon.svg" width="64" height="64" alt="Favicon">
    <img src="/src-preview/axio-favicon.svg" width="32" height="32" alt="Favicon 32" style="margin-top:8px">
    <img src="/src-preview/axio-favicon.svg" width="16" height="16" alt="Favicon 16" style="margin-top:8px">
  </div>
  <div class="card">
    <h3>Lockup (light)</h3>
    <img src="/src-preview/axio-lockup.svg" height="60" alt="Lockup">
  </div>
  <div class="card dark">
    <h3>Lockup (dark)</h3>
    <img src="/src-preview/axio-lockup-dark.svg" height="60" alt="Lockup dark">
  </div>
</body>
</html>
